<style>
:root{--leaf:#2f8f5b;--leaf-dark:#1f6a42;--leaf-soft:#e3f5ea;--sun:#ffb53d;--petal:#f26d85;--ink:#23402f;--paper:#fffdf6;--line:#d6e6d9;--ok:#1f9d63;--ok-bg:#e2f7eb;--bad:#e04f4f;--bad-bg:#fdeaea;--dark:#1f6a42}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.6;background:linear-gradient(180deg,#dff1fb 0,#eef8ee 420px,#f4faef 100%)}

.wrap{max-width:820px;margin:0 auto;padding:0 14px 80px}
.hero{position:relative;margin:0 -14px;overflow:hidden}.hero svg{display:block;width:100%;height:auto}
.hero-title{position:absolute;left:0;right:0;top:4%;text-align:center;padding:0 12px}
.hero-title .wk{display:inline-block;background:#fff;color:var(--dark);font-weight:800;border-radius:999px;padding:3px 16px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.hero-title h1{font-size:clamp(30px,8.5vw,56px);color:#fff;font-weight:800;text-shadow:0 3px 0 var(--dark),0 6px 14px rgba(0,0,0,.3);margin-top:4px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px 18px;margin-top:18px;box-shadow:0 6px 0 #cfe3d2;position:relative}
.info{display:grid;grid-template-columns:1fr 130px;gap:12px}
.info label{font-weight:800;font-size:15px;display:block;margin-bottom:4px}
.info input,.info select{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.info input[readonly]{background:#eef5ef}

input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.note{font-size:14.5px;color:#557a63;margin:8px 0 0}

.submit-zone{text-align:center;margin-top:30px}

#msg{color:var(--bad);font-weight:800;min-height:26px;margin:10px 0 0}
#result{display:none;text-align:center;background:linear-gradient(180deg,#fff8e1,#fffdf6);border-color:var(--sun);box-shadow:0 6px 0 #f0cf86}#result.show{display:block}
#rEm{font-size:60px;line-height:1}#rSc{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:var(--leaf-dark);line-height:1.1}#r10{font-weight:800;color:#b36b00}
.bar{position:fixed;left:0;right:0;top:0;height:8px;background:rgba(255,255,255,.7);z-index:20}.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .4s}
.cnt{position:fixed;top:14px;left:10px;z-index:20;background:#fff;border:2px solid var(--line);border-radius:999px;padding:1px 12px;font-weight:800;font-size:14px}
#snd{position:fixed;top:10px;right:10px;z-index:20;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:21px;cursor:pointer}
@media(max-width:600px){body{font-size:16px}.info{grid-template-columns:1fr}}
.swirl{stroke-dasharray:14 10;animation:blow 3.5s linear infinite}@keyframes blow{to{stroke-dashoffset:-96}}
.cloud{animation:drift 30s linear infinite alternate}@keyframes drift{to{transform:translateX(40px)}}
.fly{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{50%{transform:translate(8px,-10px) rotate(4deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.35}}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{50%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.swirl,.cloud,.fly,.twinkle,.sway{animation:none}html{scroll-behavior:auto}.done .fb{animation:none}}

<script>
(function(){"use strict";
var GAS_URL="https://script.google.com/macros/s/AKfycbxcmRHrOmXUrow5v79Xe0Eagd_rfxD8nxGqnTwjnieRWuLZBpgVORHnRJ3ec_4WQ7nI/exec";
var BAI="Giữa học kì I - Đề 2";
var LOP_LINK=new URLSearchParams(location.search).get('lop')||'';
var D={"items": [{"sec": "Bài 1. Đọc hiểu", "s": "Em đọc thầm đoạn văn, rồi chạm vào đáp án em chọn nhé.", "ic": "book"}, {"pass": {"title": "NHỮNG HẠT THÓC GIỐNG", "au": "(Biên soạn lại theo bài “Những hạt thóc giống”, SGK Tiếng Việt 4, tập 1)", "paras": ["Ngày xưa, có một vị vua muốn tìm người nối ngôi. Vua phát cho mỗi đứa trẻ trong vương quốc một ít thóc giống và dặn: “Ai thu hoạch được nhiều thóc nhất sẽ được chọn.”", "Chôm nhận thóc rồi đem về gieo trồng. Cậu chăm sóc đất, tưới nước mỗi ngày nhưng chờ mãi mà hạt thóc vẫn không nảy mầm. Đến ngày hẹn, các bạn đều mang những chậu cây xanh tốt đến cung điện. Chôm buồn bã ôm chiếc chậu chỉ có đất, thật thà thưa với vua rằng mình đã cố gắng hết sức nhưng thóc không mọc.", "Nhà vua nghe xong liền mỉm cười. Vua cho biết những hạt thóc đã được luộc chín nên không thể nảy mầm. Những chậu cây xanh kia đều không phải mọc từ thóc vua ban. Chôm là người duy nhất trung thực, không tìm cách nói dối để giành phần thưởng. Vì vậy, nhà vua quyết định chọn Chôm làm người nối ngôi."]}}, {"n": "1", "m": {"q": "Nhà vua phát thóc giống cho trẻ em để làm gì?", "o": ["Để các em có thóc ăn.", "Để tìm người nối ngôi.", "Để mở hội thi trồng cây.", "Để giúp dân gieo cấy."], "a": 1, "p": 0.5, "w": "Đoạn 1: nhà vua muốn tìm người nối ngôi."}}, {"n": "2", "m": {"q": "Chôm đã làm gì khi thóc không nảy mầm?", "o": ["Xin thóc giống khác.", "Nhờ bạn giúp đỡ.", "Thật thà kể lại sự việc với nhà vua.", "Mang chậu cây của bạn đến cung điện."], "a": 2, "p": 0.5, "w": "Chôm thật thà thưa với vua rằng mình đã cố gắng hết sức nhưng thóc không mọc."}}, {"n": "3", "m": {"q": "Vì sao những hạt thóc vua phát không thể nảy mầm?", "o": ["Vì đất trồng quá khô.", "Vì thóc đã được luộc chín.", "Vì Chôm quên tưới nước.", "Vì thời tiết quá lạnh."], "a": 1, "p": 0.5, "w": "Nhà vua cho biết những hạt thóc đã được luộc chín."}}, {"n": "4", "m": {"q": "Phẩm chất nổi bật của Chôm là gì?", "o": ["Dũng cảm.", "Nhanh nhẹn.", "Thông minh.", "Trung thực."], "a": 3, "p": 0.5, "w": "Chôm là người duy nhất trung thực, không nói dối để giành phần thưởng."}}, {"n": "5", "q": "Theo em, vì sao chúng ta cần sống trung thực? Viết 2–3 câu nêu ý kiến của em.", "rows": 4, "sg": "Chúng ta cần sống trung thực vì trung thực giúp mọi người tin tưởng và yêu quý nhau. Khi mắc lỗi, em cần thật thà nhận lỗi và sửa chữa lỗi lầm của mình."}, {"n": "6", "m": {"q": "Từ “trung thực” có nghĩa là gì?", "o": ["Thật thà, ngay thẳng, không nói dối.", "Vui vẻ, hòa đồng với mọi người.", "Chăm chỉ làm việc.", "Nhanh trí, hiểu biết rộng."], "a": 0, "p": 0.5, "w": "Trung thực là thật thà, ngay thẳng, không nói dối."}}, {"n": "7", "m": {"q": "Tên cơ quan, tổ chức nào dưới đây được viết đúng quy tắc?", "o": ["Trường Tiểu học Phan chu trinh", "Hội chữ thập đỏ Việt Nam", "Sở Văn hóa, Thể thao và Du lịch.", "Trường Tiểu Học Lê Văn Tám"], "a": 2, "p": 0.5, "w": "Chỉ phương án C đúng. A thiếu viết hoa tên riêng (Chu Trinh); B thiếu viết hoa “Chữ”; D viết hoa thừa “Học”."}}, {"n": "8", "g": "Khoanh vào chữ cái trước câu trả lời đúng ở mỗi ý.", "subs": [{"l": "a", "q": "Từ nào dưới đây là danh từ chung?", "o": ["Chôm", "nhà vua", "Việt Nam", "Hà Nội"], "a": 1, "p": 0.5, "w": "“nhà vua” chỉ người nói chung nên là danh từ chung. Chôm, Việt Nam, Hà Nội là tên riêng."}, {"l": "b", "q": "Từ nào dưới đây là danh từ riêng?", "o": ["cung điện", "chậu cây", "Chôm", "hạt thóc"], "a": 2, "p": 0.5, "w": "Chôm là tên riêng của nhân vật nên là danh từ riêng, viết hoa."}, {"l": "c", "q": "Từ nào dưới đây là động từ?", "o": ["trung thực", "xanh tốt", "chăm sóc", "nắng mưa"], "a": 2, "p": 0.5, "w": "“chăm sóc” chỉ hoạt động nên là động từ. “trung thực”, “xanh tốt” chỉ đặc điểm; “nắng mưa” là danh từ."}]}, {"n": "9", "m": {"q": "Câu nào dưới đây nêu đúng nội dung chính của đoạn văn thứ hai?", "o": ["Nhà vua phát thóc giống cho trẻ em trong vương quốc.", "Chôm chăm sóc thóc giống nhưng thóc không nảy mầm, cậu vẫn thật thà kể lại sự việc với nhà vua.", "Các bạn nhỏ mang những chậu cây xanh tốt đến cung điện.", "Nhà vua quyết định chọn Chôm làm người nối ngôi."], "a": 1, "p": 0.5, "w": "Đoạn hai kể Chôm chăm sóc thóc nhưng không nảy mầm và cậu thật thà thưa với vua."}}, {"n": "10", "q": "Cho câu văn: “Dòng sông chảy qua làng em.” Em hãy viết lại câu văn, thay động từ “chảy” bằng một động từ khác để câu văn giàu hình ảnh hơn và nêu tác dụng của cách thay thế đó.", "rows": 4, "sg": "Dòng sông uốn lượn qua làng em. Từ “uốn lượn” gợi hình ảnh dòng sông quanh co, mềm mại."}]};

var OKS=["Đúng rồi! Giỏi quá! 🎉","Chính xác! Em đọc kĩ lắm! ⭐","Tuyệt vời! 🌟","Đúng rồi, cố lên nào! 👏"];
var BADS=["Chưa đúng. Em xem đáp án nhé!","Tiếc quá, lần sau em sẽ làm được!","Chưa đúng. Đọc kĩ lại một chút nhé!"];
var LT="ABCD";
function $(i){return document.getElementById(i)}
function el(t,c,h){var e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function fmt(n){return String(Math.round(n*100)/100).replace(".",",")}
var sound=true,AC=null,Q=[],ES=[],graded=false,warned=false,zone=$("zone");
function beep(ok){if(!sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();var t=AC.currentTime;(ok?[[880,0],[1175,.15]]:[[200,0],[160,.17]]).forEach(function(n){var o=AC.createOscillator(),g=AC.createGain(),s=t+n[1];o.type=ok?"sine":"triangle";o.frequency.value=n[0];g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.18,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.3);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+.32)})}catch(e){}}
$("snd").addEventListener("click",function(){sound=!sound;this.textContent=sound?"🔊":"🔇";this.setAttribute("aria-pressed",sound?"false":"true");this.setAttribute("aria-label",sound?"Tắt âm thanh":"Bật âm thanh")});
function progress(){var n=Q.filter(function(m){return m.done}).length;$("cnt").textContent=n+"/"+Q.length+" câu";$("pg").style.width=(100*n/Q.length)+"%"}
function section(t,s,ic){var h=el("div","section-h",'<svg class="ico" viewBox="0 0 54 54" aria-hidden="true">'+ICO[ic]+'</svg><div><h2></h2><p></p></div>');h.querySelector("h2").textContent=t;h.querySelector("p").textContent=s;zone.appendChild(h)}
function mcq(box,m,lab,tag){
  m.id=lab;var head=el("div","q-head",'<span class="num"></span><span class="t"></span>');
  head.querySelector(".num").textContent=tag;head.querySelector(".t").innerHTML=m.q+' <span class="pts">('+fmt(m.p)+' điểm)</span>';box.appendChild(head);
  m.btns=m.o.map(function(t,j){var b=el("button","opt",'<b>'+LT[j]+'.</b><span></span>');b.type="button";b.querySelector("span").textContent=t;b.addEventListener("click",function(){answer(m,j)});box.appendChild(b);return b});
  m.fb=el("div","fb");box.appendChild(m.fb);m.box=box;Q.push(m)}
function answer(m,j){
  if(m.done)return;m.done=true;m.ok=(j===m.a);m.box.classList.add("done");
  m.btns.forEach(function(b,k){b.disabled=true;if(k===m.a)b.classList.add("right");else if(k===j)b.classList.add("wrong")});
  var pr=m.ok?OKS[Q.indexOf(m)%OKS.length]:BADS[Q.indexOf(m)%BADS.length];
  m.fb.className="fb "+(m.ok?"ok":"no");
  m.fb.innerHTML=pr+(m.ok?"":'<br>Đáp án đúng: <b>'+LT[m.a]+'</b>')+'<span class="why"></span>';
  m.fb.querySelector(".why").textContent=m.w||"";
  if(j>=0)beep(m.ok);progress()}
D.items.forEach(function(it){
  if(it.sec){section(it.sec,it.s,it.ic);return}
  if(it.pass){var c=el("div","card passage","<h3></h3>");c.querySelector("h3").textContent=it.pass.title;
    it.pass.paras.forEach(function(p){var e=el("p");e.textContent=p;c.appendChild(e)});
    var a=el("p","au");a.textContent=it.pass.au;c.appendChild(a);
    if(it.pass.gl){var g=el("div","gloss",'<b class="t">Từ ngữ</b>');it.pass.gl.forEach(function(x){var d=el("div",null,"<b></b>: <span></span>");d.firstChild.textContent=x[0];d.querySelector("span").textContent=x[1];g.appendChild(d)});c.appendChild(g)}
    zone.appendChild(c);return}
  var card=el("div","card q");zone.appendChild(card);
  if(it.m){mcq(card,it.m,"Câu "+it.n,it.n)}
  else if(it.g){var h=el("div","q-head",'<span class="num"></span><span class="t"></span>');h.querySelector(".num").textContent=it.n;h.querySelector(".t").textContent=it.g;card.appendChild(h);
    it.subs.forEach(function(s,i){var sb=el("div","sub");card.appendChild(sb);mcq(sb,s,"Câu "+it.n+s.l,s.l+")")})}
  else{var h2=el("div","q-head",'<span class="num"></span><span class="t"></span>');h2.querySelector(".num").textContent=it.n;h2.querySelector(".t").innerHTML=it.q;card.appendChild(h2);
    var ta=el("textarea");ta.setAttribute("aria-label",it.n);ta.placeholder="Em viết câu trả lời của mình vào đây...";ta.rows=it.rows||4;card.appendChild(ta);
    card.appendChild(el("p","note","✏️ Phần này cô sẽ chấm, không tính vào điểm tự động."));
    if(it.sg){var sg=el("div","sugg","<b>Gợi ý để em đối chiếu:</b> <span></span>");sg.querySelector("span").textContent=it.sg;card.appendChild(sg)}
    ES.push([it.n,ta])}
});
progress();
/* lớp + danh sách tên */
var nm=$("nm"),cl=$("cl"),sel=$("nmSel");
if(LOP_LINK){cl.value=LOP_LINK;cl.readOnly=true;
  var to=new Promise(function(_,r){setTimeout(r,5000)});
  Promise.race([fetch(GAS_URL+"?action=roster&lop="+encodeURIComponent(LOP_LINK)).then(function(r){return r.json()}),to]).then(function(d){
    if(!(d&&d.ok&&d.names&&d.names.length))return;
    sel.innerHTML='<option value="">— Chạm để chọn tên của em —</option>';
    d.names.forEach(function(n){var o=el("option");o.value=n;o.textContent=n;sel.appendChild(o)});
    var oo=el("option");oo.value="__khac";oo.textContent="Tên con không có trong danh sách";sel.appendChild(oo);
    sel.style.display="";nm.style.display="none";
    sel.addEventListener("change",function(){if(sel.value==="__khac"){nm.style.display="";nm.value="";nm.focus()}else{nm.style.display="none";nm.value=sel.value}})
  }).catch(function(){})}
function lock(on){document.querySelectorAll("textarea,#nm,#nmSel,#cl").forEach(function(x){x.disabled=on})}
$("submitBtn").addEventListener("click",function(){
  if(graded)return;var msg=$("msg");
  if(!nm.value.trim()||!cl.value.trim()){msg.textContent="Em hãy chọn hoặc điền họ tên và lớp trước khi nộp bài nhé!";
    (nm.value.trim()?cl:(sel.style.display===""&&nm.style.display==="none"?sel:nm)).focus();return}
  var blank=Q.filter(function(m){return!m.done}).length;
  if(blank>0&&!warned){warned=true;msg.textContent="Em còn "+blank+" câu chưa chọn. Em kiểm tra lại nhé – nếu vẫn muốn nộp, hãy bấm “Nộp bài” lần nữa.";return}
  msg.textContent="";graded=true;
  Q.forEach(function(m){if(!m.done)answer(m,-1)});
  var e=0,t=0,wr=[];Q.forEach(function(m){t+=m.p;if(m.ok)e+=m.p;else wr.push(m.id)});
  document.body.classList.add("graded");lock(true);$("submitBtn").disabled=true;
  var tl=ES.map(function(x){return x[1].value.trim()?x[0]+": "+x[1].value.trim():""}).filter(Boolean).join("\n");
  var body={bai:BAI,hoten:nm.value.trim(),lop:cl.value.trim(),loplink:LOP_LINK,diem:Math.round(e*100)/100,tongdiem:t,causai:wr.join(", ")};
  if(tl)body.tuluan=tl;
  try{fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).catch(function(){})}catch(x){}
  var p=e/t,em,ms;
  if(p>=.9){em="🌞";ms="Tuyệt vời! Em làm bài rất tốt!"}else if(p>=.7){em="🌤️";ms="Rất tốt! Em cố gắng thêm chút nữa nhé."}else if(p>=.5){em="🍃";ms="Khá lắm! Xem lại các ô đỏ để giỏi hơn nữa nhé."}else{em="🌱";ms="Đừng lo, đọc lại bài rồi thử lần nữa, em sẽ làm tốt hơn!"}
  $("rEm").textContent=em;$("rSc").textContent=fmt(e)+" / "+fmt(t)+" điểm";
  $("r10").textContent="Quy ra thang 10: "+fmt(Math.round(p*100)/10)+" điểm (phần trắc nghiệm)";
  $("rMsg").textContent=nm.value.trim()+" ơi, "+ms;
  $("rWrong").textContent=wr.length?"Câu cần xem lại: "+wr.join(", "):"Em đúng hết các câu trắc nghiệm!";
  $("result").classList.add("show");$("result").scrollIntoView({behavior:"smooth",block:"center"})});
$("retryBtn").addEventListener("click",function(){location.reload()});
})();
