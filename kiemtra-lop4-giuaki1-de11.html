<style>
:root{--leaf:#2f8f5b;--leaf-dark:#1f6a42;--leaf-soft:#e3f5ea;--sun:#ffb53d;--petal:#f26d85;--ink:#23402f;--paper:#fffdf6;--line:#d6e6d9;--ok:#1f9d63;--ok-bg:#e2f7eb;--bad:#e04f4f;--bad-bg:#fdeaea;--dark:#1c2a5c}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.6;background:linear-gradient(180deg,#dff1fb 0,#eef8ee 420px,#f4faef 100%)}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.2;margin:0}
.wrap{max-width:820px;margin:0 auto;padding:0 14px 80px}
.hero{position:relative;margin:0 -14px;overflow:hidden}.hero svg{display:block;width:100%;height:auto}
.hero-title{position:absolute;left:0;right:0;top:4%;text-align:center;padding:0 12px}
.hero-title .wk{display:inline-block;background:#fff;color:var(--dark);font-weight:800;border-radius:999px;padding:3px 16px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.hero-title h1{font-size:clamp(30px,8.5vw,56px);color:#fff;font-weight:800;text-shadow:0 3px 0 var(--dark),0 6px 14px rgba(0,0,0,.3);margin-top:4px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:20px 18px;margin-top:18px;box-shadow:0 6px 0 #cfe3d2;position:relative}
.info{display:grid;grid-template-columns:1fr 130px;gap:12px}
.info label{font-weight:800;font-size:15px;display:block;margin-bottom:4px}
.info input,.info select{width:100%;font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
.info input[readonly]{background:#eef5ef}
.info select{font-weight:700;min-height:48px;margin-bottom:8px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:9px;cursor:pointer;background:#fff}
.opt b{flex:none;width:24px}.opt:hover:not([disabled]){border-color:var(--leaf);background:var(--leaf-soft)}
.opt[disabled]{cursor:default;color:var(--ink)}.opt.right{border-color:var(--ok);background:var(--ok-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{display:none;margin-top:12px;border-radius:14px;padding:10px 14px;font-weight:700;font-size:16px}
.done .fb{display:block;animation:pop .35s ease-out}.fb.ok{background:var(--ok-bg);color:#126b42}.fb.no{background:var(--bad-bg);color:#a33}
.fb .why{display:block;font-weight:500;color:var(--ink);margin-top:3px}
@keyframes pop{from{transform:scale(.94);opacity:0}}
textarea{width:100%;min-height:110px;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);resize:vertical}
.note{font-size:14.5px;color:#557a63;margin:8px 0 0}
.sugg{display:none;margin-top:12px;background:#fff6dd;border:2px dashed var(--sun);border-radius:14px;padding:12px 14px}.graded .sugg{display:block}
.submit-zone{text-align:center;margin-top:30px}
.btn{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:22px;border:0;border-radius:999px;padding:12px 38px;cursor:pointer;background:var(--sun);color:#5a3a00;box-shadow:0 6px 0 #d18a12}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #d18a12}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.green{background:var(--leaf);color:#fff;box-shadow:0 6px 0 var(--leaf-dark);font-size:18px;padding:9px 28px}
#msg{color:var(--bad);font-weight:800;min-height:26px;margin:10px 0 0}
#result{display:none;text-align:center;background:linear-gradient(180deg,#fff8e1,#fffdf6);border-color:var(--sun);box-shadow:0 6px 0 #f0cf86}#result.show{display:block}
#rEm{font-size:60px;line-height:1}#rSc{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:44px;color:var(--leaf-dark);line-height:1.1}#r10{font-weight:800;color:#b36b00}
.bar{position:fixed;left:0;right:0;top:0;height:8px;background:rgba(255,255,255,.7);z-index:20}.bar i{display:block;height:100%;width:0;background:var(--leaf);transition:width .4s}
.cnt{position:fixed;top:14px;left:10px;z-index:20;background:#fff;border:2px solid var(--line);border-radius:999px;padding:1px 12px;font-weight:800;font-size:14px}
#snd{position:fixed;top:10px;right:10px;z-index:20;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:21px;cursor:pointer}
@media(max-width:600px){body{font-size:16px}.info{grid-template-columns:1fr}}
.swirl{stroke-dasharray:14 10;animation:blow 3.5s linear infinite}@keyframes blow{to{stroke-dashoffset:-96}}
.cloud{animation:drift 30s linear infinite alternate}@keyframes drift{to{transform:translateX(40px)}}
.fly{animation:bob 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes bob{50%{transform:translate(8px,-10px) rotate(4deg)}}
.twinkle{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.35}}
.sway{animation:sway 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}@keyframes sway{50%{transform:rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.swirl,.cloud,.fly,.twinkle,.sway{animation:none}html{scroll-behavior:auto}.done .fb{animation:none}}

<script>
(function(){"use strict";
var GAS_URL="https://script.google.com/macros/s/AKfycbxcmRHrOmXUrow5v79Xe0Eagd_rfxD8nxGqnTwjnieRWuLZBpgVORHnRJ3ec_4WQ7nI/exec";
var BAI="Giữa học kì I - Đề 1";
var LOP_LINK=new URLSearchParams(location.search).get('lop')||'';
var D={"items": [{"sec": "Bài 1. Đọc hiểu", "s": "Em đọc thầm đoạn văn, rồi chạm vào đáp án em chọn nhé.", "ic": "book"}, {"pass": {"title": "CÁNH DIỀU TUỔI THƠ", "au": "(Theo Tạ Duy Anh)", "paras": ["Tuổi thơ của tôi được nâng lên từ những cánh diều.", "Chiều chiều, trên bãi thả, đám trẻ mục đồng chúng tôi hò hét nhau thả diều thi. Cánh diều mềm mại như cánh bướm. Chúng tôi vui sướng đến phát dại nhìn lên trời. Tiếng sáo diều vi vu trầm bổng. Sáo đơn, rồi sáo kép, sáo bè,… như gọi thấp xuống những vì sao sớm.", "Ban đêm trên bãi thả diều thật không còn gì huyền ảo hơn. Có cảm giác diều đang trôi trên dải Ngân Hà. Bầu trời tự do đẹp như một tấm thảm nhung khổng lồ. Có cái gì cứ cháy lên, cháy mãi trong tâm hồn chúng tôi. Sau này, tôi mới hiểu đấy là khát vọng. Tôi đã ngửa cổ suốt một thời mới lớn để chờ đợi một nàng tiên áo xanh bay xuống từ trên trời và bao giờ cũng hi vọng khi tha thiết xin: “Bay đi diều ơi! Bay đi!”. Cánh diều tuổi ngọc ngà bay đi, mang theo niềm vui khát khao của tôi."], "gl": [["Mục đồng", "trẻ chăn trâu, bò, dê, cừu,…"], ["Huyền ảo", "đẹp một cách kì lạ và bí ẩn, nửa thực nửa hư."], ["Khát vọng", "điều mong muốn, đòi hỏi rất mạnh mẽ."], ["Tuổi ngọc ngà", "tuổi thơ, tuổi trẻ đẹp đẽ."], ["Khát khao", "mong muốn, đòi hỏi thiết tha."]]}}, {"n": "1", "m": {"q": "Tuổi thơ của tác giả gắn với hình ảnh nào?", "o": ["Những cánh diều.", "Những con thuyền.", "Những cánh chim.", "Những cánh buồm."], "a": 0, "p": 0.5, "w": "Câu đầu bài: tuổi thơ của tác giả được nâng lên từ những cánh diều."}}, {"n": "2", "m": {"q": "Các bạn nhỏ thường thả diều vào thời gian nào?", "o": ["Buổi sáng sớm.", "Chiều chiều.", "Buổi trưa.", "Đêm khuya."], "a": 1, "p": 0.5, "w": "Bài viết: “Chiều chiều, trên bãi thả, … thả diều thi.”"}}, {"n": "3", "m": {"q": "Tiếng sáo diều được miêu tả như thế nào?", "o": ["Rộn ràng, ồn ào.", "Trầm bổng, vi vu.", "Nhỏ nhẹ, buồn bã.", "Dồn dập, gấp gáp."], "a": 1, "p": 0.5, "w": "Bài viết: tiếng sáo diều vi vu trầm bổng."}}, {"n": "4", "m": {"q": "Hình ảnh cánh diều gợi cho tác giả điều gì?", "o": ["Nỗi lo lắng.", "Sự mệt mỏi.", "Niềm vui và khát vọng tuổi thơ.", "Nỗi buồn khi xa nhà."], "a": 2, "p": 0.5, "w": "Cánh diều mang theo niềm vui khát khao; tác giả hiểu đó là khát vọng."}}, {"n": "5", "q": "Theo em, vì sao tác giả nói cánh diều tuổi thơ mang theo niềm vui và khát vọng?", "rows": 4, "sg": "Vì cánh diều mang lại niềm vui cho trẻ thơ, đồng thời thể hiện những ước mơ, khát vọng và mong muốn vươn tới những điều tốt đẹp trong tương lai."}, {"n": "6", "m": {"q": "Muốn tra nghĩa của từ “khát vọng”, em nên dùng tài liệu nào?", "o": ["Từ điển.", "Bản đồ.", "Thời khóa biểu.", "Sổ liên lạc."], "a": 0, "p": 0.5, "w": "Muốn tra nghĩa của từ, em dùng từ điển."}}, {"n": "7", "m": {"q": "Tên cơ quan nào dưới đây được viết đúng?", "o": ["Ủy ban nhân dân phường Hòa bình.", "Bộ kế hoạch và Đầu tư.", "Trường Tiểu học Lê Văn Tám.", "Phòng giáo dục và Đào tạo."], "a": 2, "p": 0.5, "w": "Chỉ phương án C viết hoa đúng. Các phương án còn lại thiếu viết hoa: Hòa Bình, Kế hoạch, Giáo dục."}}, {"n": "8", "m": {"q": "Trong câu “Các bạn nhỏ vui sướng nhìn lên trời.”, cách xác định từ loại nào đúng?", "o": ["“bạn nhỏ” là danh từ; “trời” là động từ.", "“bạn nhỏ” là danh từ; “nhìn” là động từ.", "“nhìn” là danh từ; “trời” là động từ.", "Tất cả các từ đều là động từ."], "a": 1, "p": 1.5, "w": "“bạn nhỏ” chỉ người nên là danh từ; “nhìn” chỉ hoạt động nên là động từ; “trời” là danh từ."}}, {"n": "9", "m": {"q": "Tác dụng của câu chủ đề trong đoạn văn là gì?", "o": ["Kể lại một sự việc đã xảy ra.", "Giới thiệu hoặc nêu ý chính của đoạn văn.", "Miêu tả đặc điểm của một sự vật.", "Nêu cảm xúc của người viết về sự vật."], "a": 1, "p": 0.5, "w": "Câu chủ đề giới thiệu hoặc nêu ý chính của cả đoạn."}}, {"n": "10", "q": "Bạn Nam viết câu văn sau: <i>“Buổi sáng, những bông hoa trong vườn chạy nhảy dưới ánh nắng mặt trời.”</i> Em hãy thay động từ chưa phù hợp bằng một động từ thích hợp và giải thích vì sao em chọn từ đó.", "rows": 4, "sg": "
